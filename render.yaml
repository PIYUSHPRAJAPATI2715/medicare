services:
  - type: web
    name: medicare-backend-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
